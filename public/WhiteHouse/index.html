<style>
:root{
  --bg:#F8F5F0; --surface:#FFFFFF; --line:#E6DFD4; --ink:#1E2A2B; --muted:#566364;
  --accent:#15788F; --btn:#17809A; --btn-ink:#FFFFFF; --tint:#E3F0F3;
  --warm:#FCF1E4; --warm-line:#EFCBA2; --warm-ink:#8F4C0E; --track:#ECE6DC;
  --pill:#1E2A2B; --pill-ink:#FFFFFF; --danger:#A33B2B;
  --p-ink:#1E2A2B; --p-teal:#15788F; --p-amber:#C77A22; --p-sky:#5E9FB0; --p-sage:#5F8A6E; --p-rose:#B5617A;
  --shadow:0 1px 2px rgba(30,42,43,.04),0 8px 24px rgba(30,42,43,.06);
  --ease:cubic-bezier(.22,.61,.36,1);
  color-scheme: light;
}
:root[data-theme="dark"]{
  --bg:#101819; --surface:#182223; --line:#283435; --ink:#F2EEE7; --muted:#A2ADAD;
  --accent:#4FC0D6; --btn:#4FC0D6; --btn-ink:#0D1617; --tint:#132C33;
  --warm:#261E15; --warm-line:#5A4025; --warm-ink:#F2B57C; --track:#243031;
  --pill:#F2EEE7; --pill-ink:#101819; --danger:#F08A78;
  --p-ink:#F2EEE7; --p-teal:#4FC0D6; --p-amber:#F2B57C; --p-sky:#7FB8C8; --p-sage:#8FC1A0; --p-rose:#E39AB0;
  --shadow:none;
  color-scheme: dark;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#101819; --surface:#182223; --line:#283435; --ink:#F2EEE7; --muted:#A2ADAD;
    --accent:#4FC0D6; --btn:#4FC0D6; --btn-ink:#0D1617; --tint:#132C33;
    --warm:#261E15; --warm-line:#5A4025; --warm-ink:#F2B57C; --track:#243031;
    --pill:#F2EEE7; --pill-ink:#101819; --danger:#F08A78;
    --p-ink:#F2EEE7; --p-teal:#4FC0D6; --p-amber:#F2B57C; --p-sky:#7FB8C8; --p-sage:#8FC1A0; --p-rose:#E39AB0;
    --shadow:none; color-scheme: dark;
  }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:'Manrope',system-ui,-apple-system,sans-serif;font-size:17px;line-height:1.5;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:560px;margin:0 auto;padding:0 20px calc(48px + env(safe-area-inset-bottom))}
@media (min-width:900px){.wrap{max-width:720px}}

/* header + nav */
.top{display:flex;align-items:center;justify-content:space-between;padding:calc(20px + env(safe-area-inset-top)) 0 0}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none}
.mark{display:inline-flex;align-items:center;justify-content:center;background:#0C1517;border-radius:10px;padding:5px 7px;line-height:0}
.mark img{height:22px;width:auto;display:block}
.center .mark{border-radius:16px;padding:10px 13px}.center .mark img{height:40px}
.brand span{font-size:12px;font-weight:600;letter-spacing:.2em;text-transform:uppercase}
.icon-btn{width:44px;height:44px;border-radius:999px;border:1px solid var(--line);background:var(--surface);display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
.nav{display:flex;gap:8px;overflow-x:auto;padding:18px 0 4px;margin:0 -20px;padding-left:20px;padding-right:20px;scrollbar-width:none;position:sticky;top:0;z-index:5;background:var(--bg)}
.nav::-webkit-scrollbar{display:none}
.pill{flex:none;display:inline-flex;align-items:center;height:44px;padding:0 18px;border-radius:999px;border:1px solid var(--line);font-size:15px;font-weight:600;text-decoration:none;background:transparent;cursor:pointer;white-space:nowrap}
.pill.on{background:var(--pill);color:var(--pill-ink);border-color:var(--pill)}

/* type */
.eyebrow{font-size:13px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--accent)}
.eyebrow.warm{color:var(--warm-ink)}
.label{font-size:12px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
h1{margin:12px 0 0;font-weight:500;font-size:40px;line-height:1.08;letter-spacing:-.01em}
h2{margin:0;font-weight:500;font-size:26px;line-height:1.2}
.lede{margin:12px 0 0;font-size:18px;color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:15px}
.tiny{font-size:14px}
.big-num{font-weight:500;font-size:56px;line-height:1;letter-spacing:-.02em}
.mid-num{font-weight:700;font-size:24px}

/* layout */
.hero{padding:36px 0 4px}
.section{padding-top:36px}
.section-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow)}
.pad{padding:24px}
.list>.row{display:flex;align-items:center;gap:14px;padding:16px 20px;border-top:1px solid var(--line)}
.list>.row:first-child{border-top:0}
.row .grow{flex:1;min-width:0}
.row-title{font-size:17px;font-weight:600;overflow-wrap:anywhere}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.stack{display:flex;flex-direction:column;gap:12px}
.spread{display:flex;justify-content:space-between;align-items:center;gap:12px}
.date-chip{width:52px;flex:none;text-align:center}
.date-chip .m{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.date-chip .d{font-size:24px;font-weight:600;line-height:1.1}
.tag{display:inline-flex;align-items:center;font-size:13px;font-weight:700;padding:4px 10px;border-radius:999px;white-space:nowrap}
.tag.cool{background:var(--tint);color:var(--accent)}
.tag.warm{background:var(--warm);color:var(--warm-ink)}
.tag.plain{background:var(--track);color:var(--ink)}
.tag.alert{background:var(--warm);color:var(--danger)}
.bar{height:10px;border-radius:999px;background:var(--track);overflow:hidden}
.bar.thin{height:8px}
.bar>i{display:block;height:100%;border-radius:999px;background:var(--btn);transform-origin:left center}
.bar>i.warm{background:var(--p-amber)}
.dot{width:10px;height:10px;border-radius:999px;display:inline-block;flex:none}
.warm-card{background:var(--warm);border:1px solid var(--warm-line);border-radius:24px;padding:22px}
.warm-card .item{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 18px;border-radius:18px;background:var(--surface);text-decoration:none;margin-top:10px;width:100%;border:0;text-align:left;cursor:pointer}
.tile{display:flex;flex-direction:column;gap:8px;min-height:124px;padding:18px;border-radius:22px;background:var(--surface);border:1px solid var(--line);text-decoration:none;box-shadow:var(--shadow)}
.tile .t{font-size:17px;font-weight:600;line-height:1.3}
.tile .m{margin-top:auto;font-size:14px;color:var(--muted)}
.seg{display:flex;gap:6px;padding:6px;border-radius:999px;background:var(--surface);border:1px solid var(--line)}
.seg>*{flex:1;height:46px;display:flex;align-items:center;justify-content:center;border-radius:999px;font-size:16px;font-weight:600;text-decoration:none;border:0;background:transparent;cursor:pointer}
.seg>.on{background:var(--pill);color:var(--pill-ink)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.empty{padding:22px;border-radius:22px;border:1px dashed var(--line);color:var(--muted);text-align:center}
.notice{display:flex;gap:10px;align-items:center;font-size:14px;color:var(--muted);margin-top:12px}
.link{color:var(--accent);font-weight:600;text-decoration:none;font-size:15px;background:none;border:0;padding:0;cursor:pointer}

/* buttons + forms */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:56px;border-radius:999px;border:0;background:var(--btn);color:var(--btn-ink);font-size:17px;font-weight:700;cursor:pointer;text-decoration:none}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);font-weight:600}
.btn.small{height:44px;width:auto;padding:0 18px;font-size:15px}
.btn:disabled{opacity:.5;cursor:default}
.field{display:flex;flex-direction:column;gap:6px;margin-top:16px}
.field>span{font-size:14px;font-weight:600;color:var(--muted)}
.input{width:100%;min-height:52px;padding:12px 16px;border-radius:16px;border:1px solid var(--line);background:var(--bg);font-size:17px}
.input:focus{outline:2px solid var(--accent);outline-offset:1px}
textarea.input{min-height:96px;resize:vertical}
.check{display:flex;align-items:center;gap:12px;margin-top:16px;font-size:16px}
.check input{width:22px;height:22px;accent-color:var(--btn)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(10,16,17,.45);z-index:40;opacity:0;transition:opacity .3s ease}
.scrim.show{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-height:92vh;overflow:auto;background:var(--surface);border-radius:28px 28px 0 0;padding:12px 22px calc(24px + env(safe-area-inset-bottom));transform:translateY(100%);transition:transform .45s var(--ease)}
.sheet.show{transform:none}
@media (min-width:700px){.sheet{left:50%;right:auto;width:560px;bottom:auto;top:50%;border-radius:28px;transform:translate(-50%,-44%);opacity:0;transition:transform .45s var(--ease),opacity .3s ease}.sheet.show{transform:translate(-50%,-50%);opacity:1}}
.grab{width:44px;height:5px;border-radius:999px;background:var(--line);margin:0 auto 14px}
.sheet h2{margin-bottom:4px}
.sheet .actions{display:flex;flex-direction:column;gap:10px;margin-top:24px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translate(-50%,20px);opacity:0;background:var(--pill);color:var(--pill-ink);padding:14px 20px;border-radius:999px;font-size:15px;font-weight:600;z-index:60;transition:transform .35s var(--ease),opacity .35s ease;max-width:90vw;text-align:center}
.toast.show{transform:translate(-50%,0);opacity:1}

/* photos */
.ph{aspect-ratio:1/1;border-radius:18px;overflow:hidden;background:var(--tint);display:flex;align-items:center;justify-content:center;color:var(--accent)}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph.wide{aspect-ratio:16/10}

/* motion: transform + opacity only */
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.rise{animation:rise .8s var(--ease) both}
.d1{animation-delay:.05s}.d2{animation-delay:.12s}.d3{animation-delay:.19s}.d4{animation-delay:.26s}.d5{animation-delay:.33s}
.bar>i{animation:grow 1.1s var(--ease) .3s both}
.lift{transition:transform .35s var(--ease)}
@media (hover:hover){.lift:hover{transform:translateY(-2px)}}
.press{transition:transform .2s var(--ease),opacity .2s ease}
.press:active{transform:scale(.97)}
@media (prefers-reduced-motion: reduce){
  .rise,.bar>i{animation:none}
  .lift,.press,.sheet,.scrim,.toast{transition:none}
}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.center{min-height:80vh;display:flex;flex-direction:column;justify-content:center}

/* load intro: glowing house outline draws behind, logo fades in.
   The one motion exception: stroke-dashoffset on this single background drawing, once per page load. */
#app{position:relative;z-index:1}
.glowhouse{position:fixed;z-index:0;left:50%;top:calc(env(safe-area-inset-top) + 6vh);width:min(640px,118vw);height:auto;
  transform:translateX(-50%);pointer-events:none;color:var(--accent);opacity:0;--rest:.16;
  filter:drop-shadow(0 0 3px var(--accent)) drop-shadow(0 0 14px color-mix(in srgb,var(--accent) 55%,transparent))}
.glowhouse path{fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.glowhouse path.idx{stroke-width:2.6}
.glowhouse.rest{opacity:var(--rest)}
:root[data-theme="dark"] .glowhouse{--rest:.24}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .glowhouse{--rest:.24}}
.intro-pending .mark{opacity:0}
@keyframes markIn{from{opacity:0;transform:scale(.86)}to{opacity:1;transform:none}}
.intro .mark{animation:markIn 1s var(--ease) .75s both}
</style>
</head>

// ---------- theme ----------

const CAL_ID = 'family11574325909658758561@group.calendar.google.com';

async function calEvents(from, to) {
  const key = from + '|' + to;
  S.cache.cal = S.cache.cal || {};
  const hit = S.cache.cal[key];
  if (hit && Date.now() - hit.at < 5 * 60 * 1000) return hit.events;
  try {
    const { data } = await sb.auth.getSession();
    const token = data && data.session && data.session.access_token;
    const r = await fetch('/WhiteHouse/api/calendar?from=' + from + '&to=' + to, { headers: { Authorization: 'Bearer ' + token } });
    if (!r.ok) return null;
    const j = await r.json();
    S.cache.cal[key] = { at: Date.now(), events: j.events || [] };
    return j.events || [];
  } catch (e) { console.error(e); return null; }
}

  const t = ' ' + String(title || '').toLowerCase().replace(/[^a-z]+/g, ' ') + ' ';

const timeOf = (iso8601) => new Date(iso8601).toLocaleTimeString('en-US', { timeZone: 'America/Phoenix', hour: 'numeric', minute: '2-digit' });
function eventItem(e) {
  const m = whoOf(e.title);

}

  const C = 2 * Math.PI * 36;
  h += '<section class="section rise d3 stack" style="padding-top:20px">' + (goals.length ? goals.map((g) => '<button class="card pad lift" style="text-align:left;cursor:pointer;width:100%" data-action="goal-edit" data-id="' + esc(g.id) + '"><div style="display:flex;align-items:center;gap:20px"><div style="position:relative;width:84px;height:84px;flex:none"><svg width="84" height="84" viewBox="0 0 84 84" aria-hidden="true"><circle cx="42" cy="42" r="36" fill="none" stroke="var(--track)" stroke-width="7"/><circle cx="42" cy="42" r="36" fill="none" stroke="' + (g.progress < 35 ? 'var(--p-amber)' : 'var(--btn)') + '" stroke-width="7" stroke-linecap="round" stroke-dasharray="' + (C * g.progress / 100).toFixed(1) + ' ' + C.toFixed(1) + '" transform="rotate(-90 42 42)"/></svg><div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:19px">' + Number(g.progress) + '%</div></div><div style="min-width:0"><div class="label">' + esc(g.kind || 'Goal') + '</div><h2 style="font-size:23px;margin-top:6px">' + esc(g.name) + '</h2>' + (g.target_label ? '<div class="small muted" style="margin-top:4px">By ' + esc(g.target_label) + '</div>' : '') + '</div></div>' + (g.next_step ? '<div class="spread small" style="margin-top:18px;padding:14px 16px;border-radius:16px;background:var(--bg)"><span class="muted">Next small step</span><span style="font-weight:600;text-align:right">' + esc(g.next_step) + '</span></div>' : '') + '</button>').join('')
    : '<div class="empty">No goals here yet.</div>') + '</section>';
  h += '<section class="section rise d4"><button class="btn press" data-action="goal-edit" data-owner="' + (tab === 'mine' ? S.me : 'joint') + '">Add a goal</button></section>';
  return h;
}

function billForm(b, owner) {

  openSheet('<h2>' + (b.id ? 'Edit bill' : 'Add a bill') + '</h2>' + fieldText('label', 'Bill', b.label, 'required maxlength="80"') +
    '<div class="row2">' + fieldText('amount', isDebt ? 'Monthly payment' : 'Amount', b.amount == null ? '' : Number(b.amount).toFixed(2), 'inputmode="decimal" required') + fieldText('due_day', 'Due day of month', b.due_day || '', 'inputmode="numeric" placeholder="1–31"') + '</div>' +
    '<div class="row2">' + fieldSelect('cadence', 'How often', CADENCES, b.cadence) + fieldSelect('category', 'Category', CATEGORIES, b.category) + '</div>' +
    (isDebt ? '<div class="row2">' + fieldText('balance', 'Balance owed', b.balance == null ? '' : Number(b.balance).toFixed(2), 'inputmode="decimal"') + fieldText('apr', 'Interest rate (%)', b.apr == null ? '' : b.apr, 'inputmode="decimal"') + '</div>' : '') +
    '<label class="check"><input type="checkbox" name="autopay" value="1"' + (b.autopay ? ' checked' : '') + '> Paid automatically</label>' +
    fieldSelect('belongs_to', 'Whose bill', [[S.me, 'Mine (private)'], ['joint', 'Shared with ' + cap(otherKey())]], b.belongs_to) +
    (b.id ? '<label class="check"><input type="checkbox" name="stopped" value="1"' + (b.is_active ? '' : ' checked') + '> This bill has stopped</label>' : '') +
    fieldArea('notes', 'Notes', b.notes) + sheetActions(b.id ? 'Save' : 'Add bill'),
    async (fd) => {
      const label = String(fd.get('label') || '').trim(); const amount = num(fd.get('amount'));
      if (!label || amount == null || amount < 0) { toast('Add a name and an amount.'); return false; }
      const dd = num(fd.get('due_day')); if (dd != null && (dd < 1 || dd > 31)) { toast('Due day should be 1 to 31.'); return false; }
      const category = fd.get('category'); const cadence = fd.get('cadence');
      const row = { label, amount, due_day: dd ? Math.round(dd) : null, cadence, category, autopay: !!fd.get('autopay'), belongs_to: fd.get('belongs_to'), notes: String(fd.get('notes') || '').trim() || null, updated_at: new Date().toISOString() };
      if (category === 'debt') {
        const bal = num(fd.get('balance')); const apr = num(fd.get('apr'));
        if (bal != null && cadence !== 'monthly') { toast('Debts with a balance are paid monthly.'); return false; }
        row.balance = bal; row.apr = apr; row.balance_as_of = bal != null ? (b.balance != null && Number(b.balance) === bal ? b.balance_as_of : iso(tzToday())) : null;
      } else { row.balance = null; row.apr = null; row.balance_as_of = null; }
      if (b.id) { row.is_active = !fd.get('stopped'); await q(sb.from('obligations').update(row).eq('id', b.id), 'save the bill'); }
      else await q(sb.from('obligations').insert(row), 'add the bill');
      toast(row.belongs_to === 'joint' && b.belongs_to !== 'joint' && b.id ? 'Moved to joint' : 'Saved'); render();
    });

      toast('Saved'); render();
    });

async function uploadOne(file, folder) {
  if (file.size > 25 * 1024 * 1024) { toast('That photo is over 25 MB.'); throw new Error('too big'); }
  const ext = (file.name.split('.').pop() || 'jpg').toLowerCase().replace(/[^a-z0-9]/g, '').slice(0, 5) || 'jpg';
  const path = folder + '/' + (crypto.randomUUID ? crypto.randomUUID() : Date.now() + '-' + Math.random().toString(36).slice(2)) + '.' + ext;
  const { error } = await sb.storage.from('whitehouse').upload(path, file, { contentType: file.type || 'image/jpeg', upsert: false });
  if (error) { fail(error, 'upload the photo'); throw error; }
  return path;
}

  return '<div class="center"><div class="rise d1" style="display:flex;align-items:center;gap:10px">' + icon.house + '<span class="eyebrow" style="color:var(--ink);letter-spacing:.2em;font-size:12px">The Minnier House</span></div>' +
    '<h1 class="rise d2" style="font-size:44px">' + (sent ? 'Check your email.' : 'Welcome home.') + '</h1>' +
    (sent ? '<p class="lede rise d3">We sent a sign-in link to <strong>' + esc(sent) + '</strong>. Open it on this phone and you’re in.</p><button class="btn ghost press rise d4" style="margin-top:24px" data-action="back-signin">Use a different email</button>'
      : '<p class="lede rise d3">Our calendar, money, kids, projects and photos, all in one place.</p><form id="signin" class="rise d4" style="margin-top:24px"><label class="field"><span>Your email</span><input class="input" type="email" name="email" autocomplete="email" required placeholder="you@example.com"></label><button class="btn press" style="margin-top:16px" type="submit">Send my sign-in link</button></form><p class="tiny muted rise d5" style="margin-top:16px">No password. We email you a link each time.</p>') + '</div>';
}
ACTIONS['back-signin'] = () => { $app.innerHTML = viewSignIn(); wireSignIn(); };
function wireSignIn() {
  const f = document.getElementById('signin'); if (!f) return;
  f.addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = String(new FormData(f).get('email') || '').trim();
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) return toast('That email doesn’t look right.');
    const b = f.querySelector('button'); b.disabled = true;
    const { error } = await sb.auth.signInWithOtp({ email, options: { emailRedirectTo: location.origin + '/WhiteHouse/' } });
    b.disabled = false;
    if (error) return fail(error, 'send the link');
    $app.innerHTML = viewSignIn(email);
  });
}
function viewPrivate() {
  return '<div class="center"><div class="rise d1">' + icon.house + '</div><h1 class="rise d2">This house is private.</h1><p class="lede rise d3">You’re signed in as ' + esc(S.email || '') + ', which isn’t on the family list.</p><button class="btn ghost press rise d4" style="margin-top:24px" data-action="signout">Sign out</button></div>';
}

let renderSeq = 0;
let introDone = false;
function intro() {
  if (introDone) return; introDone = true;
  const root = document.documentElement, gh = document.getElementById('glowhouse');
  const calm = matchMedia('(prefers-reduced-motion: reduce)').matches;
  root.classList.remove('intro-pending');
  if (!gh) return;
  if (calm || !gh.animate) { gh.classList.add('rest'); return; }
  const paths = Array.from(gh.querySelectorAll('path')), STEP = 85, DRAW = 1500, ease = 'cubic-bezier(.3,.6,.2,1)';
  paths.forEach((p, i) => {
    const L = (p.getTotalLength && p.getTotalLength()) || 200;
    p.style.strokeDasharray = L; p.style.strokeDashoffset = L;
    p.animate([{ strokeDashoffset: L }, { strokeDashoffset: 0 }], { duration: DRAW, delay: 100 + i * STEP, easing: ease, fill: 'forwards' });
  });
  root.classList.add('intro');
  const rest = parseFloat(getComputedStyle(gh).getPropertyValue('--rest')) || 0.2;
  gh.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 500, easing: 'ease-out', fill: 'forwards' });
  const settle = gh.animate([{ opacity: 1 }, { opacity: rest }], { duration: 1400, delay: 100 + paths.length * STEP + DRAW, easing: ease, fill: 'forwards' });
  settle.onfinish = () => {
    paths.forEach((p) => { p.style.strokeDashoffset = 0; });
    gh.classList.add('rest');
    gh.getAnimations({ subtree: true }).forEach((a) => a.cancel());
  };
  setTimeout(() => root.classList.remove('intro'), 2000);
}

async function render() {
  const seq = ++renderSeq;
  const { data } = await sb.auth.getSession();
  const session = data && data.session;
  if (!session) { S.me = null; $app.innerHTML = viewSignIn(); wireSignIn(); return; }
  S.email = session.user.email;
  if (!S.me) {
    const { data: key, error } = await sb.rpc('my_key');
    if (error) { $app.innerHTML = '<div class="center"><h1>Almost ready.</h1><p class="lede">The household section isn’t switched on yet. Mike needs to finish one setting.</p></div>'; console.error(error); return; }
    if (!key) { $app.innerHTML = viewPrivate(); return; }
    S.me = key;
    await loadMembers().catch(() => {});
  }
  const r = route();
  const views = { today: viewToday, calendar: viewCalendar, money: viewMoney, kids: viewKids, home: viewHome, photos: viewPhotos, goals: viewGoals };
  const fn = views[r.name] || viewToday;
  if (!$app.querySelector('main')) $app.innerHTML = shell('<div class="hero"><div class="eyebrow">Loading</div></div>', r.name);
  try {
    const inner = await fn(r.arg, r.arg2);
    if (seq !== renderSeq) return;
    $app.innerHTML = shell(inner, views[r.name] ? r.name : 'today');
    const on = $app.querySelector('.nav .on'); if (on && on.scrollIntoView) on.scrollIntoView({ inline: 'center', block: 'nearest' });
  } catch (e) {
    if (seq !== renderSeq) return;
    $app.innerHTML = shell('<div class="empty" style="margin-top:40px">Something didn’t load. Pull down to refresh, or try again in a minute.</div>', r.name);
  }
}
sb.auth.onAuthStateChange((evt) => { if (evt === 'SIGNED_IN' || evt === 'SIGNED_OUT') { S.me = null; render(); } });
render().finally(intro);
</script>
</body>
</html>
